<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="400" height="600" viewBox="0 0 400 600">
  <!-- Постер «Інтерстеллар» — вертикальний 2:3 -->
  <defs>
    <radialGradient id="inter-hole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" />
      <stop offset="0.45" stop-color="#000000" />
      <stop offset="0.55" stop-color="#ffd27a" />
      <stop offset="0.75" stop-color="#d9822b" stop-opacity="0.6" />
      <stop offset="1" stop-color="#0b0f1c" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="#0b0f1c" />
  <!-- зорі -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.5" /><circle cx="120" cy="30" r="1" /><circle cx="350" cy="80" r="1.5" />
    <circle cx="300" cy="40" r="1" /><circle cx="60" cy="400" r="1" /><circle cx="370" cy="420" r="1.5" />
    <circle cx="200" cy="70" r="1" /><circle cx="30" cy="250" r="1.5" /><circle cx="380" cy="260" r="1" />
  </g>
  <!-- чорна діра з акреційним диском -->
  <ellipse cx="200" cy="240" rx="190" ry="34" fill="#ffb84d" opacity="0.55" />
  <circle cx="200" cy="240" r="130" fill="url(#inter-hole)" />
  <ellipse cx="200" cy="240" rx="150" ry="18" fill="none" stroke="#ffe2a8" stroke-width="6" />
  <!-- поле кукурудзи -->
  <rect y="430" width="400" height="170" fill="#3d3a1f" />
  <g stroke="#7a7339" stroke-width="3">
    <path d="M 20 600 L 40 440" /><path d="M 70 600 L 80 445" /><path d="M 120 600 L 125 440" />
    <path d="M 280 600 L 275 440" /><path d="M 330 600 L 320 445" /><path d="M 380 600 L 360 440" />
  </g>
  <text x="200" y="555" fill="#f4eee2" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="4">ІНТЕРСТЕЛЛАР</text>
</svg>
