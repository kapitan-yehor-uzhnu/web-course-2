<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Постер «Шалений Макс: Дорога гніву» — квадратний 1:1 -->
  <defs>
    <linearGradient id="desert-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fb0" />
      <stop offset="1" stop-color="#f2a33a" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#desert-sky)" />
  <circle cx="380" cy="120" r="46" fill="#ffe08a" />
  <!-- пустеля -->
  <path d="M 0 330 Q 120 300 250 325 T 500 315 L 500 500 L 0 500 Z" fill="#e0782a" />
  <path d="M 0 400 Q 150 370 300 395 T 500 385 L 500 500 L 0 500 Z" fill="#b8541c" />
  <!-- хмара пилу за машиною -->
  <g fill="#f5c58a" opacity="0.85">
    <circle cx="60" cy="300" r="40" /><circle cx="110" cy="285" r="34" /><circle cx="150" cy="305" r="30" />
  </g>
  <!-- вантажівка -->
  <g fill="#2b1a10">
    <rect x="160" y="270" width="190" height="50" rx="4" />
    <rect x="330" y="245" width="70" height="75" rx="6" />
    <rect x="345" y="255" width="38" height="24" fill="#f2a33a" />
    <rect x="400" y="290" width="18" height="22" />
    <rect x="185" y="250" width="10" height="20" /><rect x="205" y="245" width="10" height="25" />
    <circle cx="200" cy="326" r="20" /><circle cx="270" cy="326" r="20" /><circle cx="370" cy="326" r="20" />
  </g>
  <g fill="#b8541c">
    <circle cx="200" cy="326" r="7" /><circle cx="270" cy="326" r="7" /><circle cx="370" cy="326" r="7" />
  </g>
  <text x="250" y="430" fill="#fff4e0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="1">ШАЛЕНИЙ МАКС</text>
  <text x="250" y="468" fill="#2b1a10" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">ДОРОГА ГНІВУ</text>
</svg>
