  <g fill="#ffe1a6"><circle cx="90" cy="318" r="2" /><circle cx="110" cy="318" r="2" /><circle cx="130" cy="318" r="2" /><circle cx="150" cy="318" r="2" /><circle cx="170" cy="318" r="2" /><circle cx="190" cy="318" r="2" /><circle cx="210" cy="318" r="2" /><circle cx="230" cy="318" r="2" /><circle cx="250" cy="318" r="2" /><circle cx="270" cy="318" r="2" /></g>
  <text x="200" y="540" fill="#f4eee2" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="middle" letter-spacing="8">ТИТАНІК</text>
