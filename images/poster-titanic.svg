      <stop offset="0" stop-color="#2b2a4a" />
      <stop offset="0.6" stop-color="#d9775a" />
      <stop offset="1" stop-color="#f4c27a" />
    </linearGradient>
  </defs>
  <rect width="400" height="360" fill="url(#tit-sky)" />
  <circle cx="290" cy="330" r="44" fill="#ffe1a6" />
