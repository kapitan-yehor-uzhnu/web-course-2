<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="400" height="600" viewBox="0 0 400 600">
  <!-- Постер «Гравітація» — вертикальний 2:3, астронавт над Землею -->
  <defs>
    <radialGradient id="grav-earth" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#6fb7ff" />
      <stop offset="0.6" stop-color="#1f5fa8" />
      <stop offset="1" stop-color="#0a2347" />
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="#02040a" />
  <g fill="#ffffff"><circle cx="50" cy="80" r="1.5" /><circle cx="330" cy="50" r="1" /><circle cx="250" cy="150" r="1.2" /><circle cx="90" cy="220" r="1" /><circle cx="360" cy="230" r="1.5" /></g>
  <!-- край Землі -->
  <circle cx="200" cy="900" r="520" fill="url(#grav-earth)" />
  <path d="M -320 900 A 520 520 0 0 1 720 900" fill="none" stroke="#bfe3ff" stroke-width="6" opacity="0.6" />
  <!-- астронавт -->
  <g transform="translate(210 230) rotate(-25)">
    <rect x="-22" y="-10" width="44" height="60" rx="14" fill="#e9edf2" />
    <circle cx="0" cy="-28" r="22" fill="#e9edf2" />
    <circle cx="0" cy="-28" r="14" fill="#f0a63a" />
    <rect x="-40" y="0" width="18" height="40" rx="9" fill="#d6dbe2" />
    <rect x="22" y="0" width="18" height="40" rx="9" fill="#d6dbe2" />
    <rect x="-18" y="48" width="14" height="36" rx="7" fill="#d6dbe2" />
    <rect x="4" y="48" width="14" height="36" rx="7" fill="#d6dbe2" />
  </g>
  <!-- обірваний трос -->
  <path d="M 250 260 Q 300 300 330 280 Q 360 260 380 300" fill="none" stroke="#d6dbe2" stroke-width="3" />
  <text x="200" y="555" fill="#f4eee2" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="5">ГРАВІТАЦІЯ</text>
</svg>
