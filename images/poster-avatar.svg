<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="400" height="600" viewBox="0 0 400 600">
  <!-- Постер «Аватар» — вертикальний 2:3, летючі гори Пандори -->
  <defs>
    <linearGradient id="av-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a3a" />
      <stop offset="1" stop-color="#11665e" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#av-sky)" />
  <!-- летючі гори -->
  <g fill="#0b3b38">
    <path d="M 40 160 Q 90 90 140 160 L 120 200 Q 90 230 60 200 Z" />
    <path d="M 230 110 Q 300 40 360 110 L 335 160 Q 295 195 255 160 Z" />
    <path d="M 150 300 Q 210 240 270 300 L 250 340 Q 210 365 170 340 Z" />
  </g>
  <g fill="#1f8a6e"><path d="M 40 160 Q 90 120 140 160" /><path d="M 230 110 Q 300 70 360 110" /><path d="M 150 300 Q 210 265 270 300" /></g>
  <!-- ліани -->
  <g stroke="#1f8a6e" stroke-width="2" fill="none"><path d="M 90 205 Q 95 260 85 320" /><path d="M 300 175 Q 310 240 295 300" /><path d="M 210 355 Q 215 400 205 440" /></g>
  <!-- біолюмінесцентні вогники -->
  <g fill="#7ff5ff">
    <circle cx="60" cy="460" r="3" /><circle cx="110" cy="430" r="2" /><circle cx="160" cy="470" r="3" />
    <circle cx="250" cy="440" r="2" /><circle cx="300" cy="475" r="3" /><circle cx="350" cy="445" r="2" />
    <circle cx="200" cy="400" r="2" /><circle cx="30" cy="380" r="2" /><circle cx="370" cy="380" r="2" />
  </g>
  <rect y="490" width="400" height="110" fill="#06202a" />
  <text x="200" y="560" fill="#9ff7ff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" text-anchor="middle" letter-spacing="10">АВАТАР</text>
</svg>
