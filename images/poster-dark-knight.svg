<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="400" height="600" viewBox="0 0 400 600">
  <!-- Постер «Темний лицар» — вертикальний 2:3 -->
  <defs>
    <linearGradient id="dk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1420" />
      <stop offset="1" stop-color="#2a3a52" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#dk-sky)" />
  <!-- промінь прожектора з кажаном -->
  <path d="M 200 600 L 120 120 L 280 120 Z" fill="#fff6c8" opacity="0.15" />
  <ellipse cx="200" cy="130" rx="85" ry="48" fill="#fff6c8" opacity="0.9" />
  <path d="M 140 130 Q 160 110 175 122 L 185 105 L 192 120 L 208 120 L 215 105 L 225 122 Q 240 110 260 130 Q 235 128 228 150 Q 215 135 200 158 Q 185 135 172 150 Q 165 128 140 130 Z" fill="#0d1420" />
  <!-- хмарочоси Готема -->
  <g fill="#070b12">
    <rect x="0" y="330" width="60" height="270" /><rect x="65" y="280" width="50" height="320" />
    <rect x="120" y="360" width="45" height="240" /><rect x="235" y="350" width="45" height="250" />
    <rect x="285" y="270" width="55" height="330" /><rect x="345" y="320" width="55" height="280" />
  </g>
  <text x="200" y="520" fill="#f4eee2" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="4">ТЕМНИЙ</text>
  <text x="200" y="565" fill="#f4eee2" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="4">ЛИЦАР</text>
</svg>
